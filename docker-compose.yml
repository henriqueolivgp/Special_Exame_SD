version: "3.8"
services:

  auth-db:
    container_name: auth-db
    build: docker/images/db
    volumes:
      - auth_data:/var/lib/postgresql/data/
    networks:
      - auth

  auth-api:
    container_name: auth-api
    build: 
      context: ./src/auth-api
      dockerfile: ../../docker/images/javascript/Dockerfile
    networks:
      - auth
      - common
    environment:
      - USE_DEV_MODE
      - PORT=70

  bl-db:
    container_name: bl-db
    build: docker/images/db
    volumes:
      - bl_data:/var/lib/postgresql/data/
    networks:
      - bl

  bl-api:
    container_name: bl-api
    build: 
      context: ./src/bl-api
      dockerfile: ../../docker/images/javascript/Dockerfile
    networks:
      - bl
      - common
    environment:
      - USE_DEV_MODE
      - PORT=8080
      - SWAGGER_PORT=8081
      - DATABASE_URL=postgresql://sd:sd@bl-db:5432/sd?schema=public

  importer:
    container_name: importer
    build: 
      context: ./src/importer
      dockerfile: ../../docker/images/javascript/Dockerfile
    networks:
      - bl
    volumes:
      - importer_data:/data
    environment:
      - USE_DEV_MODE

  frontend:
    container_name: frontend
    build: 
      context: ./src/web
      dockerfile: ../../docker/images/javascript/Dockerfile
    networks:
      - common
    environment:
      - USE_DEV_MODE
      - PORT=70
      - REACT_APP_API_URL=http://localhost:$BL_API_PORT

networks:
  common:
    driver: bridge
  auth:
    driver: bridge
  bl:
    driver: bridge

volumes:
  auth_data:
  bl_data:
  importer_data: